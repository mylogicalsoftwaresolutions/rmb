org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m -XX:+UseG1GC
org.gradle.daemon=false
org.gradle.workers.max=2
org.gradle.parallel=false
# Windows file watching continually invalidates Gradle's cache in this project,
# making Android configuration take several minutes before compilation begins.
org.gradle.vfs.watch=false
android.useAndroidX=true
android.enableR8.fullMode=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

# Lint's classloader is a large metaspace consumer and adds nothing to an APK build.
android.experimental.lint.missingBaselineIsEmptyBaseline=true
